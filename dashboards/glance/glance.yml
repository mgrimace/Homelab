theme:
  presets:
    neon-focus:
      background-color: 255 14 6
      primary-color: 156 50 65
      negative-color: 342 65 65
      contrast-multiplier: 0.9
      text-saturation-multiplier: 0.8

    gruvbox-dark:
      background-color: 0 0 16
      primary-color: 43 59 81
      positive-color: 61 66 44
      negative-color: 6 96 59

    catppuccin-macchiato:
      background-color: 232 23 18
      contrast-multiplier: 1.2
      primary-color: 220 83 75
      positive-color: 105 48 72
      negative-color: 351 74 73

    moondust-dark:
      background-color: 200 10 9
      primary-color: 203 24 48
      positive-color: 207 33 73
      negative-color: 207 24 52
      contrast-multiplier: 1.0
      text-saturation-multiplier: 0.7

pages:
  - name: Startpage
    width: slim
    #hide-desktop-navigation: true
    center-vertically: true
    columns:
      - size: full
        widgets:
          - type: search
            hide-header: true
            seach-engine: duckduckgo
            autofocus: true
            new-tab: true
          - type: server-stats
            hide-header: true
            servers:
              - type: local
                name: Homelab
                hide-swap: true
                hide-mountpoints-by-default: true
                mountpoints:
                  "/mnt/media":
                    hide: false
                    name: media
          - type: split-column
            max-columns: 3
            widgets:
              - type: monitor
                cache: 1m
                #title: Services
                hide-header: true
                sites:      
                  - title: Overseerr
                    url: http://${HOMEPAGE_VAR_SERVER_IP}:5055
                    icon: sh:overseerr
                  - title: ToDo
                    url: https://todo.${HOMEPAGE_VAR_DOMAIN}
                    icon: https://raw.githubusercontent.com/mgrimace/energy-todo/558bb990e73d0906c0672194ea0ad96c39477e8e/frontend/public/icons/icon-dark-transparent.svg
                  - title: Calibre-Web
                    url: https://calibreweb.${HOMEPAGE_VAR_DOMAIN}
                    icon: sh:calibre-web
              - type: calendar
                hide-header: true
                first-day-of-week: sunday
              - type: weather
                hide-header: true
                units: metric
                hour-format: 12h
                location: Saint Catharines, Canada
          #- type: bookmarks
          #  hide-header: true
          #  groups:
          #    - title: Homelab
          #      links:
          #        - title: TTECK
          #          url: https://community-scripts.github.io/ProxmoxVE/
          #        - title: Z-Lib
          #          url: https://1lib.sk/
          #        - title: Mobilism
          #          url: https://forum.mobilism.org/index.php
              #- type: change-detection
              #  title: change detection
              #  instance-url: http://${HOMEPAGE_VAR_CHANGE_IP}:5000
              #  token: ${CHANGE_KEY}

  - name: News
    width: slim
    #hide-desktop-navigation: true
    center-vertically: true
    columns:
      - size: full
        widgets:
          - type: split-column
            max-columns: 3
            widgets:
              - type: releases
                repositories:
                  - fccview/jotty
                  - julian-alarcon/prospect-mail
                  - fosrl/pangolin
                  - madeofpendletonwool/PinePods
                  - janeczku/calibre-web
                  - TheNetsky/Microsoft-Rewards-Script
                  - yokoffing/Betterfox        
                  - gitlab:crafty-controller/crafty-4
                  - koush/scrypted
                  - Simonwep/ocular
                  - jellyfin/jellyfin
                  - dani-garcia/vaultwarden
                  - ratgdo/homekit-ratgdo
                  - javedh-dev/tracktor
                  - chrisvel/tududi
                  - crocodilestick/Calibre-Web-Automated
                  - Quenary/tugtainer

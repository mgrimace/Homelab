name: system
# ===== THIS COMPOSE FILE =====
# Services included:
# - Dockerproxy
# - Dockge
# - Dozzle
# - NTFY
# - Uptime-Kuma
# - Watchtower

# == ANCHORS ==
# These anchors define baseline configuration applied to most containers.
# Default behavior:
#   - Include all entries under '&homelab-default' via <<: *homelab-default
#   - Additional labels can be added per container using <<: *labels

x-app: &a1
  restart: unless-stopped
  security_opt:
    - no-new-privileges=true
  networks:
    - homelab
    - skynet
    - homefinance
    - tunnels
  labels:
    com.centurylinklabs.watchtower.enable: "true"
  env_file:
    - ../envs/global.env
    - ../envs/system.env
services:
  dockerproxy:
    <<: *a1
    image: lscr.io/linuxserver/socket-proxy:latest
    container_name: dockerproxy
    environment:
      CONTAINERS: 1
      SERVICES: 1
      TASKS: 1
      POST: 0
      INFO: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    tmpfs:
      - /run
    ports:
      - 2375:2375
  dockge:
    <<: *a1
    container_name: dockge
    image: louislam/dockge:1
    ports:
      - 5001:5001
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./dockge/data:/app/data
      - /opt/homelab:/opt/homelab
    environment:
      DOCKGE_STACKS_DIR: /opt/homelab
  dozzle:
    <<: *a1
    container_name: dozzle
    image: amir20/dozzle:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - 9991:8080
  ntfy:
    <<: *a1
    image: binwiederhier/ntfy
    container_name: ntfy
    command:
      - serve
    environment:
      NTFY_UPSTREAM_BASE_URL: https://ntfy.sh
      NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
      NTFY_AUTH_FILE: /var/lib/ntfy/auth.db
      NTFY_AUTH_DEFAULT_ACCESS: deny-all
      NTFY_BEHIND_PROXY: true
      NTFY_ATTACHMENT_CACHE_DIR: /var/lib/ntfy/attachments
      NTFY_ENABLE_LOGIN: true
    volumes:
      - ./ntfy/var/cache/ntfy:/var/cache/ntfy
      - ./ntfy/etc/ntfy:/etc/ntfy
      - ./ntfy:/var/lib/ntfy
    ports:
      - 8150:80
  watchtower:
    <<: *a1
    image: nickfedor/watchtower
    container_name: watchtower
    environment:
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_INCLUDE_RESTARTING: "true"
      WATCHTOWER_INCLUDE_STOPPED: "true"
      WATCHTOWER_SCHEDULE: 0 0 3 * * *
      WATCHTOWER_TIMEOUT: "30"
      WATCHTOWER_HTTP_API_UPDATE: "true"
      WATCHTOWER_HTTP_API_METRICS: "true"
      WATCHTOWER_HTTP_API_PERIODIC_POLLS: "true"
      WATCHTOWER_NOTIFICATIONS: shoutrrr
      WATCHTOWER_NOTIFICATION_SKIP_TITLE: "True"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - 8090:8080
    
  uptime-kuma:
    <<: *a1
    container_name: uptime-kuma
    image: louislam/uptime-kuma:2
    volumes:
      - ./uptime-kuma/data:/app/data
    ports:
      - 3001:3001
networks:
  homelab:
    driver: bridge
    external: true
  skynet:
    driver: bridge
    external: true
  homefinance:
    driver: bridge
    external: true
  tunnels:
    driver: bridge
    external: true

#      - DUMBDO_SITE_TITLE=ToDo
      # (Optional) Restrict origins - ex: https://subdomain.domain.tld,https://auth.proxy.tld,http://internalip:port' (default is '*')
      # - ALLOWED_ORIGINS=http://localhost:3000
      # - NODE_ENV=development # default production (development allows all origins)
    #healthcheck:
    #  test: wget --spider -q  http://127.0.0.1:3000
    #  start_period: 20s
    #  interval: 20s
    #  timeout: 5s
    #  retries: 3

 # jotty:
 #   <<: *homelab-default
 #   image: ghcr.io/fccview/jotty:develop
 #   container_name: jotty
 #   user: "1000:1000"
 #   ports:
 #     - "1122:3000"
 #   volumes:
 #     - ./jotty/data:/app/data:rw
 #     - ./jotty/config:/app/config:rw
 #     - ./jotty/cache:/app/.next/cache:rw
 #   environment:
 #     - NODE_ENV=production
            
  mealie:
    <<: *homelab-default
    #description: recipe manager
    image: ghcr.io/mealie-recipes/mealie:latest
    container_name: mealie
    ports:
      - 9925:9000
    deploy:
      resources:
        limits:
          memory: 1000M
    volumes:
      - ./mealie:/app/data
    environment:
      #commented-out values are provided in apps.env
      ALLOW_SIGNUP: "false"
      #BASE_URL: "${MEALIE_URL}"
      MAX_WORKERS: "1"
      WEB_CONCURRENCY: "1"
      #SMTP_HOST: "${SMTP_HOST}"
      #SMTP_PORT: "${SMTP_PORT}"
      SMTP_FROM_NAME: "Mealie"
      SMTP_AUTH_STRATEGY: "TLS"
      #SMTP_FROM_EMAIL: "${SMTP_FROM_EMAIL}"
      #SMTP_USER: "${SMTP_USER}"
      #SMTP_PASSWORD: "${SMTP_PASSWORD}"

  nametag-db:
    <<: *homelab-default
    image: postgres:16-alpine
    container_name: nametag-db
    volumes:
      - ./nametag/postgres_data:/var/lib/postgresql/data
    # All environment vars loaded from apps.env

  nametag:
    <<: *homelab-default
    image: ghcr.io/mattogodoy/nametag:latest
    container_name: nametag
    ports:
      - "3030:3000"
    depends_on:
      - nametag-db

  nametag-cron:
    <<: *homelab-default
    image: alpine:3.19
    container_name: nametag-cron
    command: >
      sh -c "
        echo '0 8 * * * wget -q -O - --header=\"Authorization: Bearer '\"$$CRON_SECRET\"'\" http://nametag:3000/api/cron/send-reminders > /proc/1/fd/1 2>&1' > /etc/crontabs/root &&
        echo '0 3 * * * wget -q -O - --header=\"Authorization: Bearer '\"$$CRON_SECRET\"'\" http://nametag:3000/api/cron/purge-deleted > /proc/1/fd/1 2>&1' >> /etc/crontabs/root &&
        crond -f -l 2
      "
    depends_on:
      - nametag

  flatnotes:
    <<: *homelab-default
    container_name: flatnotes
    image: dullage/flatnotes:latest
    environment:
      FLATNOTES_AUTH_TYPE: "none" #change to totp if tunneling
      #FLATNOTES_USERNAME: "user" #enable password details if tunneling
      #FLATNOTES_PASSWORD: "changeMe!"
      #FLATNOTES_SECRET_KEY: "aLongRandomSeriesOfCharacters"
    volumes:
      - /mnt/media/notes:/data
      # Optional. Allows you to save the search index in a different location: 
      - ./flatnotes/index:/data/.flatnotes
    ports:
      - 8383:8080

  tracktor:
    #description: https://github.com/javedh-dev/tracktor
    <<: *homelab-default
    image: ghcr.io/javedh-dev/tracktor:latest
    container_name: tracktor
    ports:
      - "3333:3000"
    volumes:
      - ./tracktor:/data
    environment:
      NODE_ENV: production
      PUBLIC_DEMO_MODE: false

### NETWORKS
networks:
  homelab:
    driver: bridge
    external: true
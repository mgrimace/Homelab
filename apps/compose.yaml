name: "apps"

# ===== THIS COMPOSE FILE =====
# Services included:
#   - Energy-Todo
#   - Jotty
#   - Mealie
#   - Nametag
#   - Flatnotes
#   - Traktor

# == ANCHORS ==
# These anchors define baseline configuration applied to most containers.
# Default behavior:
#   - Include all entries under '&homelab-default' via <<: *homelab-default
#   - Additional labels can be added per container using <<: *labels

x-app: &homelab-default 
  restart: unless-stopped
  security_opt:
    - no-new-privileges=true
  networks:
    - homelab
  labels: &labels
    com.centurylinklabs.watchtower.enable: "true"
  env_file: &env-files
    - ../envs/global.env
    - ../envs/apps.env

services:
  
  energy-todo:
    <<: *homelab-default
    image: ghcr.io/mgrimace/energy-todo:latest
    container_name: energy-todo
    ports:
      - 1133:3000   # keep same port dumbdo used (optional)
    volumes:
      - ./energy-todo/data:/app/data:rw
    environment:
      RUST_LOG: ${RUST_LOG:-info}
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /run:rw,noexec,nosuid,size=16m
  
#  dumbdo:
#    <<: *homelab-default
    #description: https://github.com/DumbWareio/DumbDo
#    image: dumbwareio/dumbdo:latest
#    container_name: dumbdo
#    ports:
#      - 1133:3000
#    volumes:
#      - ./dumbdo/data:/app/data

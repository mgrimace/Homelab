name: "finances"

# ===== THIS COMPOSE FILE =====
# Services included:
#   - budget-overview

# == ANCHORS ==
# These anchors define baseline configuration applied to most containers.
# Default behavior:
#   - Include all entries under '&finance-default' via <<: *finance-default
#   - Additional labels can be added per container using <<: *labels

x-app: &finance-default
  restart: unless-stopped
  security_opt:
    - no-new-privileges=true
  networks:
    - homefinance
  labels: &labels
    com.centurylinklabs.watchtower.enable: "true"
  env_file: &env-files
    - ../envs/global.env
    - ../envs/finances.env

services:

  budget-overview:
    #description: https://github.com/mgrimace/budget-overview
    <<: *finance-default
    container_name: budget-overview
    image: ghcr.io/mgrimace/budget-overview:latest
    ports:
      - "3002:3001"
    volumes:
      - ./budget-overview:/app/data
    environment:
      DATABASE_PATH: /app/data/budget.db


### NETWORKS
networks:
  homefinance:
    driver: bridge
    external: true